version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imrich
      POSTGRES_PASSWORD: imrich
      POSTGRES_DB: imrich
    ports:
      - "5432:5432"
    volumes:
      - imrich_pgdata:/var/lib/postgresql/data
volumes:
  imrich_pgdata:
